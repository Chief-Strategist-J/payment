openapi: 3.1.0
info:
  title: Payment Service REST API
  version: 1.0.0
  description: >
    Production-grade enterprise payment service supporting payment intents,
    authorization, capture, refunds, and list queries with multi-tenancy and idempotency.
servers:
  - url: http://localhost:3002
    description: Local development
  - url: https://payment.internal.prod
    description: Production internal gateway

paths:
  /:
    get:
      summary: Root Service Check
      operationId: rootCheck
      responses:
        '200':
          description: Service information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardApiResponse'

  /health:
    get:
      summary: Health Check
      operationId: healthCheck
      responses:
        '200':
          description: Service health status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardApiResponse'

  /api/v1/payments:
    post:
      summary: Create Payment Intent
      operationId: createPaymentIntent
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/XTenantId'
        - $ref: '#/components/parameters/XIdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePaymentIntentInput'
      responses:
        '201':
          description: Payment intent created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

    get:
      summary: List Payments
      operationId: listPayments
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/XTenantId'
        - name: orgId
          in: query
          schema:
            type: string
        - name: userId
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
            enum: [draft, authorized, captured, refunded, failed]
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: cursor
          in: query
          schema:
            type: string
      responses:
        '200':
          description: List of payments
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentListResponse'

  /api/v1/payments/{id}:
    get:
      summary: Get Payment by ID
      operationId: getPaymentById
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/XTenantId'
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Payment details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/payments/{id}/capture:
    post:
      summary: Capture Payment
      operationId: capturePayment
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/XTenantId'
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CapturePaymentInput'
      responses:
        '200':
          description: Payment captured successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentResponse'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/v1/payments/{id}/refund:
    post:
      summary: Refund Payment
      operationId: refundPayment
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/XTenantId'
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefundPaymentInput'
      responses:
        '200':
          description: Payment refund initiated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentResponse'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    XTenantId:
      name: x-tenant-id
      in: header
      required: true
      schema:
        type: string
    XIdempotencyKey:
      name: x-idempotency-key
      in: header
      required: false
      schema:
        type: string

  schemas:
    StandardApiResponse:
      type: object
      required: [success, statusCode, meta]
      properties:
        success:
          type: boolean
        statusCode:
          type: integer
        data:
          type: object
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
        meta:
          type: object
          required: [requestId, correlationId, timestamp, apiVersion]
          properties:
            requestId:
              type: string
            correlationId:
              type: string
            timestamp:
              type: string
              format: date-time
            apiVersion:
              type: string

    CreatePaymentIntentInput:
      type: object
      required: [amountCents]
      properties:
        amountCents:
          type: integer
          minimum: 1
        currency:
          type: string
          default: USD
        orgId:
          type: string
        userId:
          type: string
        metadata:
          type: object

    CapturePaymentInput:
      type: object
      required: [gatewayReference]
      properties:
        gatewayReference:
          type: string

    RefundPaymentInput:
      type: object
      properties:
        reason:
          type: string

    PaymentResponse:
      type: object
      required: [success, statusCode, data, meta]
      properties:
        success:
          type: boolean
        statusCode:
          type: integer
        data:
          type: object
          properties:
            id:
              type: string
              format: uuid
            tenantId:
              type: string
            orgId:
              type: string
            userId:
              type: string
            amountCents:
              type: integer
            currency:
              type: string
            status:
              type: string
              enum: [draft, authorized, captured, refunded, failed]
            gatewayReference:
              type: string
              nullable: true
            createdAt:
              type: string
              format: date-time
            updatedAt:
              type: string
              format: date-time
        meta:
          $ref: '#/components/schemas/StandardApiResponse/properties/meta'

    PaymentListResponse:
      type: object
      required: [success, statusCode, data, meta]
      properties:
        success:
          type: boolean
        statusCode:
          type: integer
        data:
          type: object
          properties:
            items:
              type: array
              items:
                type: object
            total:
              type: integer
        meta:
          $ref: '#/components/schemas/StandardApiResponse/properties/meta'

  responses:
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StandardApiResponse'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StandardApiResponse'
    Conflict:
      description: State conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StandardApiResponse'
    UnprocessableEntity:
      description: Validation or business rule failure
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StandardApiResponse'
